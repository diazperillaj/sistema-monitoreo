[project]
name = "alarma-hogar"
version = "0.1.0"
description = "API del sistema de monitoreo del hogar: FastAPI, MQTT y PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "aiomqtt>=2,<3",
]

[dependency-groups]
# No entran en la imagen de Docker
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "paho-mqtt>=2.1",  # simulador de la central (tools/)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
