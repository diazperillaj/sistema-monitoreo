[project]
name = "alarma-hogar"
version = "0.1.0"
description = "API del sistema de monitoreo del hogar: FastAPI, MQTT y PostgreSQL."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "aiomqtt>=2,<3",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.1",
    "tzdata>=2024.1",
    "pywebpush>=2.0",
]

[dependency-groups]
# No entran en la imagen de Docker
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "paho-mqtt>=2.1",  # simulador de la central (tools/)
    "testcontainers[postgres]>=4.8",
    "httpx-ws>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Un solo bucle para toda la sesión: la base de pruebas y sus conexiones se comparten
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
