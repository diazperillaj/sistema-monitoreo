# Migraciones de la base de datos (§7). La URL sale de DATABASE_URL (migrations/env.py).
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Nombres como 0001_inicial.py: alembic revision --rev-id 0001 -m "inicial"
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
