# Mosquitto de Alarma hogar (§5.4)
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Interno: solo la red de Docker (el puerto NO se publica en compose; en desarrollo, solo en localhost)
listener 1883

# Externo: centrales ESP32 por internet
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt
# Sin tls_version: por defecto acepta TLS 1.2 y 1.3 (la ESP32 negocia 1.2)
